[package]
name = "appv3-tools"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

# Not unused: `pdf-inspector` pins anydoc's PDF engine (see below).
[package.metadata.cargo-machete]
ignored = ["pdf-inspector"]

[dependencies]
rayon = "1"
dunce.workspace = true
appv3-core.workspace = true
appv3-providers.workspace = true
thiserror.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true
ignore.workspace = true
regex.workspace = true
regex-syntax = "0.8"
shlex.workspace = true
tempfile = "3"
reqwest.workspace = true
futures.workspace = true
async-trait.workspace = true
sha2.workspace = true
base64 = "0.23"
zip = { version = "9", default-features = false, features = ["deflate"] }
fancy-regex = "0.19"
memchr = "2"
globset = "0.4"
os_pipe = "1"
# HTML → Markdown for web_fetch. htmd is pinned to 0.5.6: 0.6.0 escapes `&`
# as `\&` (inside link URLs too) and pads link text with spaces, which the
# model then copies (compared on real pages, 2026-11-18). 0.5.6 is on
# html5ever and rcdom 0.38, `trafilatura` is on 0.39 and our direct `scraper`
# is on 0.40, so the binary carries several parsers. markup5ever_rcdom must
# match htmd's (its `Element.node`); html5ever must match scraper's
# (`HtmlTreeSink`).
htmd = "=0.5.6"
markup5ever_rcdom = "0.38"
html5ever = "0.40"
encoding_rs = "0.8"
scraper = "0.29"
# Main-content extraction for web_fetch (port of go-trafilatura, the Go port
# of the Python library v2 uses). No default features: its Markdown converter
# is replaced by htmd + our code-block handlers.
trafilatura = { version = "=0.6.1", default-features = false }
unicode-normalization = "0.1"
# PDF/DOCX → Markdown for `read` and `web_fetch`: the same Rust crate v2's
# `firecrawl-anydoc` wheel wraps.
anydoc = "=0.2.4"
# Not used directly: pins anydoc's PDF engine. Past the 1.14.2 that v2's
# anydoc 0.2.4 wheel was built with, so PDF text no longer matches v2 byte
# for byte (sub/superscripts, de-hyphenation, fenced code); see REPORT.md.
pdf-inspector = "=1.26.1"
urlencoding = "2"
toml = "1.1"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process", "fs"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
