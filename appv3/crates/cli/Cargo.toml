[package]
name = "appv3-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "openagentd"
path = "src/main.rs"

[dependencies]
dunce.workspace = true
appv3-core.workspace = true
appv3-db.workspace = true
appv3-api.workspace = true
appv3-preview.workspace = true
appv3-tools.workspace = true
axum.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
appv3-agent.workspace = true
appv3-providers.workspace = true
appv3-tui.workspace = true
regex.workspace = true
uuid.workspace = true
sqlx.workspace = true
tar = "0.4"
flate2 = "1"
libc = "0.2"
reqwest.workspace = true
sha2.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
