<!doctype html>
<!--
  Source for the README banner and the GitHub social preview.
  Render with: bun scripts/readme-shots/banner.mjs
  Query: ?theme=light|dark  &layout=banner|social
  Colours and type follow DESIGN.md ("OpenAgentd Paper").
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenAgentd banner</title>
<style>
  @font-face { font-family: "Inter Variable"; font-weight: 100 900; src: url("../../../../web/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2") format("woff2"); }
  @font-face { font-family: "JetBrains Mono Variable"; font-weight: 100 800; src: url("../../../../web/node_modules/@fontsource-variable/jetbrains-mono/files/jetbrains-mono-latin-wght-normal.woff2") format("woff2"); }
  /* The face the wordmark is drawn from; headline only, as on openagentd.dev. */
  @font-face { font-family: "Schibsted Grotesk"; font-weight: 400 900; src: url("../../../../scripts/brand/fonts/SchibstedGrotesk-wght.ttf") format("truetype"); }

  :root {
    --page: #FAF6EC; --rail: #F5EFDD; --card: #FFFBF1; --key: #F0E9D4;
    --border: #D9CFA9; --border-strong: #B8A47E;
    --ink: #1A1714; --ink-2: #4B3E32; --muted: #6E604F;
    /* Signal Blue, the logo's dot; --accent-text is the AA text blue. */
    --accent-text: #174A73;
    --shadow: 0 1px 0 rgba(63, 52, 41, .06), 0 28px 70px -18px rgba(63, 52, 41, .32);
    --glow: rgba(90, 168, 226, .14);
    --w: 1600px; --h: 640px; --pad-x: 84px; --pad-y: 72px;
    --h1: 64px; --sub: 21px; --col: 610px;
    --win-left: 760px; --win-top: 84px; --win-w: 1040px;
  }
  .dark {
    --page: #15110D; --rail: #110D0A; --card: #1C1813; --key: #2A2219;
    --border: #3A2F23; --border-strong: #5C4B36;
    --ink: #F5EBD8; --ink-2: #C5B59A; --muted: #9C8A72;
    --accent-text: #9DD0F5;
    --shadow: 0 1px 0 rgba(0, 0, 0, .4), 0 30px 80px -16px rgba(0, 0, 0, .7);
    --glow: rgba(124, 194, 240, .10);
  }
  .social {
    --w: 1280px; --h: 640px; --pad-x: 64px; --pad-y: 64px;
    --h1: 52px; --sub: 19px; --col: 520px;
    --win-left: 610px; --win-top: 196px; --win-w: 900px;
  }

  * { box-sizing: border-box; margin: 0; }
  html, body { background: transparent; }
  body { font-family: "Inter Variable", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }

  .canvas {
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h);
    background:
      radial-gradient(900px 520px at 78% 108%, var(--glow), transparent 70%),
      var(--page);
    border: 1px solid var(--border);
    border-radius: 24px;
    color: var(--ink);
  }

  .copy { position: absolute; left: var(--pad-x); top: var(--pad-y); width: var(--col); z-index: 2; }
  .brand { display: block; height: 34px; width: auto; }
  h1 {
    margin-top: 44px;
    font-family: "Schibsted Grotesk", "Inter Variable", system-ui, sans-serif;
    font-size: var(--h1); line-height: 1.05; font-weight: 600; letter-spacing: -0.03em;
  }
  h1 em { font-style: normal; color: var(--accent-text); }
  p.sub { margin-top: 24px; font-size: var(--sub); line-height: 1.5; color: var(--muted); max-width: 30em; }
  .platforms {
    margin-top: 30px; display: flex; gap: 8px; flex-wrap: wrap;
    font: 500 14px/1 "JetBrains Mono Variable", ui-monospace, monospace; color: var(--ink-2);
  }
  .platforms span { padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); }

  .window {
    position: absolute; left: var(--win-left); top: var(--win-top);
    width: var(--win-w); height: calc(var(--h) * 1.2);
    border: 1px solid var(--border-strong); border-radius: 14px; overflow: hidden;
    background: var(--card); box-shadow: var(--shadow);
  }
  .window .bar { height: 34px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: var(--rail); border-bottom: 1px solid var(--border); }
  .window .bar i { width: 11px; height: 11px; border-radius: 50%; background: var(--border); }
  /* banner-shot-*.webp is a 1280 px wide capture with the app sidebar collapsed. */
  .window .shot { display: block; width: 100%; }
</style>
</head>
<body>
<div class="canvas" id="canvas">
  <div class="copy">
    <img class="brand" id="wordmark" alt="OpenAgentd">
    <h1>The coding agent that <em>shows its work.</em></h1>
    <p class="sub">A local-first desktop app for coding agents. Every step, diff and token in view, on your machine.</p>
    <div class="platforms"><span>macOS</span><span>Windows</span><span>Linux</span><span>iOS</span><span>Android</span></div>
  </div>

  <div class="window">
    <div class="bar"><i></i><i></i><i></i></div>
    <img class="shot" id="shot" alt="">
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search)
  const theme = q.get("theme") === "dark" ? "dark" : "light"
  document.documentElement.classList.toggle("dark", theme === "dark")
  document.documentElement.classList.toggle("social", q.get("layout") === "social")
  document.getElementById("shot").src = `banner-shot-${theme}.webp`
  document.getElementById("wordmark").src = `../logo/openagentd-wordmark-${theme}.svg`
</script>
</body>
</html>
