name: Update Homebrew Tap

# Publishes the CLI formula (`brew install lthoangg/tap/openagentd`) from the
# prebuilt archives release.yml attaches to the latest `v<X.Y.Z>` release.
# No Python or Rust toolchain is needed on the user's machine, and v2
# formula installs move to v3 with a plain `brew upgrade`.
#
# The release is GitHub's "latest", which the final v2 release (2.27.0,
# created with --latest=false) never becomes. Anything below 3.x is refused
# so the formula cannot fall back to the Python package.

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:

env:
  # Opt JS actions into Node.js 24 ahead of the June 2026 forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-tap:
    name: Update homebrew-tap formula
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Resolve latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=$(gh api repos/lthoangg/openagentd/releases/latest --jq .tag_name)
          VERSION="${TAG#v}"
          case "$VERSION" in
            [0-2].*) echo "::error::latest release $TAG is not v3+; refusing to publish"; exit 1 ;;
          esac
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        id: sums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.release.outputs.version }}"
          gh release download "${{ steps.release.outputs.tag }}" --repo lthoangg/openagentd \
            --pattern 'openagentd-*.tar.gz.sha256' --dir _sums
          for t in aarch64-apple-darwin x86_64-unknown-linux-gnu; do
            f="_sums/openagentd-${VERSION}-${t}.tar.gz.sha256"
            test -f "$f" || { echo "::error::missing $f (release.yml not finished?)"; exit 1; }
            key=$(echo "$t" | tr '-' '_')
            echo "${key}=$(cut -d' ' -f1 "$f")" >> "$GITHUB_OUTPUT"
          done

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: lthoangg/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update formula
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          BASE="https://github.com/lthoangg/openagentd/releases/download/v${VERSION}/openagentd-${VERSION}"

          cat > homebrew-tap/Formula/openagentd.rb <<FORMULA
          class Openagentd < Formula
            desc "Local coding agent server and CLI"
            homepage "https://openagentd.dev"
            version "${VERSION}"
            license "Apache-2.0"

            on_macos do
              depends_on arch: :arm64
              url "${BASE}-aarch64-apple-darwin.tar.gz"
              sha256 "${{ steps.sums.outputs.aarch64_apple_darwin }}"
            end

            on_linux do
              depends_on arch: :x86_64
              url "${BASE}-x86_64-unknown-linux-gnu.tar.gz"
              sha256 "${{ steps.sums.outputs.x86_64_unknown_linux_gnu }}"
            end

            def install
              # Every executable at the archive root (agentd, the openagentd
              # alias, plus any future companion binary).
              Dir["*"].each { |f| bin.install f if File.file?(f) && File.executable?(f) }
            end

            def caveats
              <<~EOS
                Run \`agentd --help\` to get started, or see
                https://github.com/lthoangg/openagentd for documentation.
                Upgrade with \`brew upgrade openagentd\` (\`agentd upgrade\` does this too).
              EOS
            end

            test do
              assert_match "agentd v#{version}", shell_output("#{bin}/agentd --version")
            end
          end
          FORMULA

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/openagentd.rb
          git diff --cached --quiet && echo "No changes, skipping" || \
            (git commit -m "openagentd ${{ steps.release.outputs.tag }}" && git push)
