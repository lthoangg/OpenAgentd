name: Release Desktop

# Triggered manually from the Actions tab once a version is tagged.
# Produces installers for (macOS: Developer ID signed + notarized):
#   - macOS arm64 (.dmg, .app.tar.gz)
#   - Windows x64 (.msi)
#   - Linux x64  (.AppImage, .deb)
#
# Each app bundles, as its backend sidecar (sidecar-bundle/bin/agentd),
# the CLI archive that ``release.yml`` published for the same version, so
# users get one binary whether they install the CLI or the desktop app.
# Outputs are attached to the GitHub Release matching the appv3/Cargo.toml
# workspace version (tag ``v<X.Y.Z>`` — the same tag ``release.yml`` creates for the
# CLI archives). Run ``release.yml`` first: builds fail fast when the
# release has no CLI archive for their target. This workflow then appends
# the desktop installers via ``gh release upload --clobber``.
# The ``latest.json`` updater manifest is generated last and uploaded
# to the same release; the Tauri updater endpoint (configured in
# tauri.conf.json) points at the rolling ``latest-desktop`` release
# which only mirrors ``latest.json``.
#
# Jobs: build (matrix, no secrets) → sign (environment ``release-macos``,
# needs your approval; Developer ID + notarization + updater .sig files)
# → publish. Build jobs must never get signing secrets or an
# ``environment:``.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'release-desktop' to confirm"
        required: true
      channel:
        description: "Release channel"
        type: choice
        options: [stable, beta, nightly]
        default: stable
      platform:
        description: "Platform matrix to build"
        type: choice
        options: [all, windows, macos, linux]
        default: all
      run_id:
        description: "Run ID to publish existing artifacts from (optional)"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Opt JS actions into Node.js 24 ahead of the June 2026 forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  prepare:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'release-desktop'
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        # Use the same ``v<X.Y.Z>`` tag as ``release.yml``. Both
        # workflows publish into one release so the artefact set
        # (CLI archives + .dmg + .msi + .deb) live under one tag the user
        # can compare-link to. The publish job below uploads with
        # ``--clobber`` so it does not matter which workflow runs first.
        run: |
          VERSION=$(scripts/release_version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
      - id: matrix
        run: |
          case "${{ github.event.inputs.platform }}" in
            all)
              MATRIX='{"include":[{"platform":"macos","arch":"aarch64","runner":"macos-26","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin --verbose"},{"platform":"windows","arch":"x86_64","runner":"windows-2025","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--bundles msi --verbose"},{"platform":"linux","arch":"x86_64","runner":"ubuntu-22.04","rust_target":"x86_64-unknown-linux-gnu","tauri_args":"--bundles deb --verbose"}]}'
              ;;
            macos)
              MATRIX='{"include":[{"platform":"macos","arch":"aarch64","runner":"macos-26","rust_target":"aarch64-apple-darwin","tauri_args":"--target aarch64-apple-darwin --verbose"}]}'
              ;;
            windows)
              MATRIX='{"include":[{"platform":"windows","arch":"x86_64","runner":"windows-2025","rust_target":"x86_64-pc-windows-msvc","tauri_args":"--bundles msi --verbose"}]}'
              ;;
            linux)
              MATRIX='{"include":[{"platform":"linux","arch":"x86_64","runner":"ubuntu-22.04","rust_target":"x86_64-unknown-linux-gnu","tauri_args":"--bundles deb --verbose"}]}'
              ;;
            *)
              echo "Unknown platform: ${{ github.event.inputs.platform }}" >&2
              exit 1
              ;;
          esac
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: github.event.inputs.run_id == ''
    name: Build (${{ matrix.platform }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Reuse the stripped fat-LTO binary release.yml already built and
      # smoke-tested instead of compiling it again. Runs before any toolchain
      # install so a missing CLI release fails in seconds. Local bundles
      # still build the sidecar via ``make -C desktop sidecar``.
      - name: Stage backend sidecar from the CLI release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          TAG: ${{ needs.prepare.outputs.tag }}
          TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail
          exe="" ext="tar.gz"
          [ "${{ matrix.platform }}" = "windows" ] && exe=".exe" ext="zip"
          archive="openagentd-${VERSION}-${TARGET}.${ext}"
          dl="$RUNNER_TEMP/cli"
          gh release download "$TAG" --pattern "$archive" --pattern "$archive.sha256" --dir "$dl" \
            || { echo "::error::$TAG has no $archive. Run release.yml for this version first."; exit 1; }
          (
            cd "$dl"
            if command -v sha256sum >/dev/null; then sha256sum -c "$archive.sha256"
            else shasum -a 256 -c "$archive.sha256"; fi
          )
          mkdir -p "$dl/x"
          if [ "$ext" = "zip" ]; then 7z x -o"$dl/x" "$dl/$archive" >/dev/null
          else tar -xzf "$dl/$archive" -C "$dl/x"; fi
          rm -rf desktop/sidecar-bundle
          mkdir -p desktop/sidecar-bundle/bin
          cp "$dl/x/agentd$exe" "desktop/sidecar-bundle/bin/agentd$exe"
          reported=$("desktop/sidecar-bundle/bin/agentd$exe" --version | tr -d '\r')
          [ "$reported" = "agentd v$VERSION" ] || { echo "sidecar version mismatch: $reported"; exit 1; }
          du -sh desktop/sidecar-bundle

      - name: Install Linux WebKitGTK + AppImage deps
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libfuse2

      # ``linuxdeploy`` and the AppImage runtime use a FUSE-mounted
      # squashfs by default. GitHub-hosted ubuntu-22.04 runners don't
      # allow FUSE mounts inside the action environment, so we tell the
      # AppImage tools to extract-and-run instead. Without this the
      # bundle step dies with a bare 'failed to run linuxdeploy' and
      # Tauri swallows the actual error message.
      - name: Configure AppImage extract-and-run mode
        if: matrix.platform == 'linux'
        run: echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust_target }}

      # /FASTLINK speeds up MSVC linking; unrelated to any compiler cache.
      - name: Configure compiler env
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "windows" ]; then
            echo "RUSTFLAGS=-C link-arg=/FASTLINK" >> "$GITHUB_ENV"
          fi

      # ``Swatinem/rust-cache`` cleans the target/ tree (drops examples,
      # tests, incremental artifacts) before saving, then keys on
      # ``rustc -Vv``, ``Cargo.lock``, and target triple so a Rust
      # toolchain bump or dependency change invalidates correctly.
      #
      # These blobs still measure ~0.5-1.5 GB each. The repo-wide GitHub
      # cache budget is a hard 10 GB shared by every workflow, so keep an
      # eye on ``gh api /repos/{owner}/{repo}/actions/cache/usage`` when
      # adding cached paths — at the cap, GitHub evicts by LRU and every
      # cache silently degrades to partial restores.
      #
      # Measured hit rate: about half of releases (the key survives version
      # bumps and misses only when the dependency set in Cargo.lock changes).
      # On a hit, Linux "Build Tauri app" drops from ~300s to ~80s and
      # Windows saves 1-2 min; macOS showed no clear gain (352-497s hit vs
      # 395-637s miss), so macOS skips the cache and its ~530 MB entry.
      - name: Cache cargo registry + target
        if: matrix.platform != 'macos'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # The sidecar comes prebuilt from the CLI release, so appv3 is
          # never compiled here.
          workspaces: desktop/src-tauri
          key: ${{ matrix.platform }}-${{ matrix.arch }}
          # Keep every downloaded ``.crate`` archive, not just the crates that
          # are dependencies of the current lockfile. The default (``false``)
          # prunes "anything that is not a dependency", so build-dependencies
          # and proc-macro crates (tauri-build, tauri-codegen, tauri-macros,
          # thiserror-impl, windows-interface, …) get re-downloaded whenever a
          # lock change shifts the dependency set. Costs cache size; saves the
          # ``Downloading crates ...`` phase of ``cargo build``.
          cache-all-crates: true
          # Save on every run including PR re-pushes — without this,
          # only the default branch warms the cache.
          save-if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}

      # ``tauri-cli`` is a single 30 MB prebuilt binary
      # (``~/.cargo/bin/cargo-tauri``).
      # The naïve flow — install
      # ``cargo-binstall``, then ``binstall --version "^2.0"`` — has
      # two hidden costs:
      #
      # 1. Anonymous GitHub API rate limit. binstall resolves the
      #    latest 2.x release via ``api.github.com``. GitHub-hosted
      #    runners share egress IPs, and the anonymous limit (60/hr
      #    per IP) gets blown out on busy days, especially on the
      #    larger macOS pool. We've seen this step sit on 120s
      #    retries for 10+ minutes. Passing ``GITHUB_TOKEN`` lifts
      #    the limit to 5000/hr.
      # 2. The binary doesn't change between runs. ``actions/cache``
      #    keyed on the pinned version eliminates the re-download
      #    entirely on subsequent runs (per ``runner.os``/``arch``).
      #
      # Order: cache check → install binstall if miss → binstall if
      # miss. Pinning to ``2.12.4`` avoids the semver resolution
      # hop; bump it deliberately when Tauri ships a new patch.
      - name: Restore cached tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/cargo-tauri
            ~/.cargo/bin/cargo-tauri.exe
          key: tauri-cli-2.12.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-binstall
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-binstall

      - name: Install tauri-cli (prebuilt)
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        env:
          # Authenticated GitHub API requests — 5000/hr instead of
          # the anonymous 60/hr. Without this, binstall reliably
          # stalls on 120s rate-limit retries on macOS-26 runners.
          GITHUB_TOKEN: ${{ github.token }}
        # ``--force``: Swatinem/rust-cache restores ``~/.cargo/.crates2.json``
        # which tracks cargo-installed binaries.  It does NOT restore
        # ``~/.cargo/bin/`` itself, so on a fresh runner the metadata
        # says ``tauri-cli`` is installed while the binary is missing.
        # Without ``--force``, binstall sees the stale metadata, no-ops,
        # and the next step (``cargo tauri icon``) fails with
        # ``no such command: tauri``.
        run: cargo binstall --no-confirm --force --version 2.12.4 tauri-cli

      # Platform icon assets are generated and committed under
      # desktop/src-tauri/icons; release runners consume them directly.
      #
      # This job never sees the Apple certificate, the notary key or the
      # updater (minisign) key: the build runs third-party code (build.rs,
      # npm scripts). Tauri signs the macOS app ad hoc and makes no updater
      # artifacts; the ``sign`` job (environment ``release-macos``) signs,
      # notarizes and creates the updater archive and .sig files.
      - name: Configure build (no signing secrets)
        shell: bash
        run: echo 'TAURI_CONFIG={"bundle":{"createUpdaterArtifacts":false}}' >> "$GITHUB_ENV"

      - name: Import Windows Authenticode certificate
        id: windows_signing
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "openagentd-signing.pfx"
          [IO.File]::WriteAllBytes(
            $pfxPath,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          )
          $password = ConvertTo-SecureString `
            $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $certificate = Import-PfxCertificate `
            -FilePath $pfxPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password $password
          if (-not $certificate.Thumbprint) {
            throw "Imported Windows certificate has no thumbprint"
          }
          $override = @{
            bundle = @{
              createUpdaterArtifacts = $false
              windows = @{
                certificateThumbprint = $certificate.Thumbprint
                digestAlgorithm = "sha256"
                timestampUrl = "http://timestamp.digicert.com"
              }
            }
          } | ConvertTo-Json -Compress -Depth 4
          "TAURI_CONFIG=$override" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "signed=true" | Out-File `
            -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Remove-Item $pfxPath -Force

      - name: Build Tauri app
        working-directory: desktop/src-tauri
        shell: bash
        run: cargo tauri build ${{ matrix.tauri_args }}

      - name: Verify Windows MSI
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msis = @(
            Get-ChildItem `
              -Path desktop/src-tauri/target/release/bundle/msi `
              -Filter 'OpenAgentd_*.msi' `
              -File -Recurse
          )
          if ($msis.Count -ne 1) {
            throw "Expected exactly one OpenAgentd MSI, found $($msis.Count)"
          }
          $msi = $msis[0].FullName
          if ('${{ steps.windows_signing.outputs.signed }}' -eq 'true') {
            & signtool verify /pa /all $msi
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode verification failed for $msi"
            }
          }

      # macOS: hand the whole (ad hoc signed) bundle to the ``sign`` job as
      # one tarball; upload-artifact would drop the executable bits and
      # symlinks inside OpenAgentd.app. The artifact is prefixed
      # ``unsigned-`` so ``publish`` never picks it up.
      - name: Collect unsigned macOS bundle
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          mkdir -p _release
          COPYFILE_DISABLE=1 tar --no-mac-metadata -czf _release/unsigned-macos-bundle.tar.gz \
            -C "desktop/src-tauri/target/${{ matrix.rust_target }}/release" \
            bundle/macos/OpenAgentd.app bundle/dmg

      - name: Collect artefacts
        if: matrix.platform != 'macos'
        shell: bash
        run: |
          mkdir -p _release
          cd desktop/src-tauri/target
          # Tauri writes to ${target}/release/bundle/{msi,deb,...}
          if [ -d release/bundle ]; then
            BUNDLE_DIR=release/bundle
          else
            BUNDLE_DIR=${{ matrix.rust_target }}/release/bundle
          fi
          # Installers use `{productName}_{version}_{arch}{.lang}.{ext}`.
          # Updater .sig files are made by the ``sign`` job.
          find "$BUNDLE_DIR" -type f \( \
            -name 'OpenAgentd_*.msi' \
            -o -name 'OpenAgentd_*.AppImage' \
            -o -name 'OpenAgentd_*.deb' \
          \) -print -exec cp {} "$GITHUB_WORKSPACE/_release/" \;

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.platform == 'macos' && 'unsigned' || 'openagentd' }}-desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: _release/*
          if-no-files-found: error
          retention-days: 14

  # The only job that holds signing secrets, all from the protected
  # ``release-macos`` environment (your approval, ``main`` / ``v*`` only).
  # It runs short, trusted steps: no project build, no npm.
  #   - macOS: Developer ID signature (sidecar first), notarize + staple the
  #     app, updater archive + .sig, DMG swap, notarize + staple the DMG.
  #   - Windows: the updater .sig for the MSI.
  # Runbook (certificates, keys, renewal, revocation):
  # desktop/src-tauri/AGENTS.md.
  sign:
    needs: [prepare, build]
    if: github.event.inputs.run_id == '' && needs.build.result == 'success' && github.event.inputs.platform != 'linux'
    name: Sign and notarize
    runs-on: macos-26
    environment: release-macos
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: _in
          pattern: "*-desktop-*"

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      # ``cargo tauri signer sign`` writes the updater .sig files.
      - name: Restore cached tauri-cli
        id: cache-tauri-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-2.12.4-${{ runner.os }}-${{ runner.arch }}

      - name: Install cargo-binstall
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-binstall

      - name: Install tauri-cli (prebuilt)
        if: steps.cache-tauri-cli.outputs.cache-hit != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall --no-confirm --force --version 2.12.4 tauri-cli

      - name: Import Developer ID certificate and notary key
        id: keychain
        if: hashFiles('_in/unsigned-desktop-macos-*/unsigned-macos-bundle.tar.gz') != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD APPLE_API_KEY_P8; do
            [ -n "${!v}" ] || { echo "::error::secret $v is not set in environment release-macos"; exit 1; }
          done
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          umask 077
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          # Let codesign use the key without a UI prompt.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          # Prepend ours, keep the runner's keychains (paths have no spaces).
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN_PATH" \
            $(security list-keychains -d user | tr -d '"')
          printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: Sign and notarize macOS release
        if: steps.keychain.outcome == 'success'
        env:
          REQUIRE_DEVELOPER_ID: "1"
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/macos"
          mkdir -p "$work"
          tar -xzf _in/unsigned-desktop-macos-*/unsigned-macos-bundle.tar.gz -C "$work"
          bundle_id=$(python3 -c "import json; print(json.load(open('desktop/src-tauri/tauri.conf.json'))['identifier'])")
          desktop/scripts/sign-macos-release.sh "$work/bundle" "$bundle_id"
          # The designated requirement must name our Team ID, so macOS keeps
          # privacy grants across releases.
          [ -n "$APPLE_TEAM_ID" ] || { echo "::error::APPLE_TEAM_ID is not set in environment release-macos"; exit 1; }
          codesign -d -r - "$work/bundle/macos/OpenAgentd.app" 2>&1 \
            | grep -E "subject\.OU\] = \"?${APPLE_TEAM_ID}\"?"
          mkdir -p _release/macos
          cp "$work"/bundle/dmg/OpenAgentd_*.dmg \
             "$work"/bundle/macos/OpenAgentd.app.tar.gz \
             "$work"/bundle/macos/OpenAgentd.app.tar.gz.sig _release/macos/

      - name: Sign Windows updater artifact
        if: hashFiles('_in/openagentd-desktop-windows-*/OpenAgentd_*.msi') != ''
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] || { echo "::error::TAURI_SIGNING_PRIVATE_KEY is not set in environment release-macos"; exit 1; }
          mkdir -p _release/windows
          for msi in _in/openagentd-desktop-windows-*/OpenAgentd_*.msi; do
            cargo tauri signer sign "$msi" >/dev/null
            cp "$msi.sig" _release/windows/
          done

      - name: Upload signed macOS artefacts
        if: hashFiles('_release/macos/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openagentd-desktop-macos-aarch64
          path: _release/macos/*
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows updater signature
        if: hashFiles('_release/windows/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openagentd-desktop-windows-sig
          path: _release/windows/*
          if-no-files-found: error
          retention-days: 14

      - name: Remove keychain and keys
        if: always()
        run: |
          [ -n "${KEYCHAIN_PATH:-}" ] && security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12"

  publish:
    needs: [prepare, build, sign]
    name: Publish release
    runs-on: ubuntu-latest
    if: always() && needs.prepare.result == 'success' && (github.event.inputs.platform == 'all' || github.event.inputs.run_id != '') && (github.event.inputs.run_id != '' || (needs.build.result == 'success' && needs.sign.result == 'success'))
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: _artifacts
          # Signed artifacts only; ``unsigned-*`` feeds the sign job.
          pattern: openagentd-desktop-*
          run-id: ${{ github.event.inputs.run_id != '' && github.event.inputs.run_id || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Flatten artefacts
        run: |
          mkdir -p _release
          find _artifacts -type f -exec cp {} _release/ \;
          ls -la _release

      - name: Generate latest.json (Tauri updater manifest)
        run: |
          python3 scripts/make_updater_manifest.py \
            --version "${{ needs.prepare.outputs.version }}" \
            --channel "${{ github.event.inputs.channel }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --artefact-dir _release \
            --out _release/latest.json \
            --require-platform darwin-aarch64 \
            --require-platform windows-x86_64

      - name: Create or update GitHub release
        # Releases land on the shared ``v<X.Y.Z>`` tag. If
        # ``release.yml`` already created the release with the
        # canonical notes + CLI archives, we append our installers
        # via ``upload --clobber``. If we ran first, we create the
        # release with a minimal title; ``release.yml`` will then
        # ``upload`` the CLI archives on top.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ needs.prepare.outputs.tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --generate-notes
          fi
          for file in _release/*; do
            [ -f "$file" ] || continue
            echo "Uploading $file..."
            uploaded=false
            for attempt in 1 2 3 4 5; do
              if gh release upload "$TAG" "$file" --clobber; then
                uploaded=true
                echo "Successfully uploaded $file"
                break
              fi
              echo "Upload failed for $file (attempt $attempt), retrying in 5s..."
              sleep 5
            done
            if [ "$uploaded" != "true" ]; then
              echo "error: failed to upload $file after 5 attempts" >&2
              exit 1
            fi
          done

      # The Tauri updater (configured in tauri.conf.json) fetches
      # ``releases/download/latest-desktop/latest.json``. That URL must
      # always resolve to the most recent desktop release's manifest, so
      # we maintain a rolling ``latest-desktop`` release that mirrors
      # only ``latest.json``. The artefact URLs *inside* latest.json
      # still point at the immutable ``v{X.Y.Z}`` release above,
      # so old clients keep working and downloads are cacheable.
      - name: Update rolling latest-desktop release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ROLLING_TAG="latest-desktop"
          NOTES="Auto-generated. Points at OpenAgentd Desktop ${{ needs.prepare.outputs.version }}. Do not download artefacts from this release directly — use the versioned release instead."
          if gh release view "$ROLLING_TAG" >/dev/null 2>&1; then
            gh release upload "$ROLLING_TAG" _release/latest.json --clobber
            gh release edit "$ROLLING_TAG" \
              --title "Desktop updater manifest (rolling)" \
              --notes "$NOTES" \
              --prerelease \
              --draft=false
          else
            gh release create "$ROLLING_TAG" _release/latest.json \
              --title "Desktop updater manifest (rolling)" \
              --notes "$NOTES" \
              --prerelease
          fi
