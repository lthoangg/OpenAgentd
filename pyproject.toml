[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openagentd"
version = "1.104.3"  # keep in sync with app/version.txt
description = "Self-hosted AI agents — streaming chat, tool use, persistent memory, multi-agent teams"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "Apache-2.0"}
authors = [{name = "openagentd contributors"}]
keywords = ["ai", "agents", "llm", "fastapi", "self-hosted", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Framework :: FastAPI",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic-settings>=2.13.1",
    "httpx>=0.28.1",
    "sqlmodel>=0.0.22",
    "loguru>=0.7.0",
    "alembic>=1.13.1",
    "aiosqlite>=0.20.0",
    # Required at runtime by SQLAlchemy's async engine (sqlite+aiosqlite).
    # Do NOT remove: sqlalchemy declares greenlet behind a platform_machine
    # marker that misses macOS arm64 — the exact platform the desktop
    # sidecar ships for. Without this explicit pin the async DB layer
    # breaks on Apple Silicon.
    "greenlet>=3.3.2",
    "ddgs>=9.12.0",
    # Document conversion ships with only the formats used by the slim sidecar:
    # PDF and DOCX via extras, plus HTML through markitdown core. Heavier
    # features stay behind optional extras to keep the desktop bundle small.
    "markitdown[pdf,docx]>=0.1.5",
    "pyyaml>=6.0.3",
    "fastapi>=0.135.2",
    "uvicorn>=0.42.0",
    # WebSocket protocol support for uvicorn (terminal PTY streaming).
    # uvicorn is installed bare (no [standard] extra) and picks up the
    # ws implementation only if importable — declare it explicitly so
    # WS support never hinges on another package's transitive tree.
    "websockets>=16.0",
    "sse-starlette>=3.3.4",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "python-multipart>=0.0.24",
    "croniter>=6.2.2",
    "mcp>=1.0.0",
    "boto3>=1.35.0",
    "botocore[crt]>=1.43.1",
    "duckdb>=1.1.0",
]

[project.urls]
Repository = "https://github.com/lthoangg/openagentd"
"Bug Tracker" = "https://github.com/lthoangg/openagentd/issues"

[project.scripts]
openagentd = "app.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-randomly>=4.1.0",
    "pytest-xdist>=3.6.1",
    "respx>=0.22.0",
    "ruff>=0.15.8",
    "tiktoken>=0.12.0",
    "ty>=0.0.33,<0.1",
]
experiment = [
    "sentence-transformers>=5.6.0",
    "turbovec>=0.8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# Include non-Python data files inside the package: alembic config
# and migration scripts. The web UI is packaged by the desktop shell,
# not embedded in the FastAPI server wheel.
[tool.hatch.build.targets.wheel.force-include]
"app/alembic.ini" = "app/alembic.ini"

[project.optional-dependencies]
# Azure Document Intelligence routing in markitdown — server-side OCR fallback.
# Brings in the azure-ai-* SDK family. Adds ~30 MB.
azure-doc-intel = ["markitdown[az-doc-intel]>=0.1.5"]

# Audio transcription via markitdown's audio backend
# (speech_recognition + pydub). Adds ~50 MB and handles file-attached audio;
# live microphone input uses client-side speech recognition instead.
audio = ["markitdown[audio-transcription]>=0.1.5"]

# Convenience: everything-but-the-kitchen-sink. Used by
# ``uv tool install openagentd[full]`` for users who don't care about size.
full = ["openagentd[audio,azure-doc-intel]"]

[tool.uv]
package = true

[tool.ty.src]
include = ["app"]
exclude = ["tests", "**/__pycache__", ".venv"]

[tool.ruff]
target-version = "py313"
