[package]
name = "openagentd-mobile"
version = "3.51.3"
description = "OpenAgentd mobile shell"
authors = ["openagentd contributors"]
license = "Apache-2.0"
homepage = "https://openagentd.dev"
repository = "https://github.com/lthoangg/openagentd"
edition = "2021"
rust-version = "1.85"

[lib]
name = "openagentd_mobile_lib"
# staticlib: iOS links it into the Xcode app. cdylib: Android loads it as
# libopenagentd_mobile_lib.so from the APK.
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openagentd-shell-core = { path = "../../native/shell-core", features = ["keyring"] }
tauri = { version = "2", features = [] }
time = "=0.3.55"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-haptics = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.23"
sha2 = "0.10"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }
# OpenAgentd Cloud accounts (optional): the protocol, the API client, and the
# relay session. Its crypto dependencies are reviewed in
# appv3/contract/tunnel-threats.md.
openagentd-cloud = { path = "../../native/cloud" }
# The loopback bridge that carries the web UI's requests over the relay.
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["net", "io-util", "sync", "time", "macros", "rt"] }
subtle = "2.6"
zeroize = "1.8"
form_urlencoded = "1"

# The QR scanner for connect links (Servers → Scan QR code). Mobile only.
[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
# Photos and Files in the composer's + menu: the native media and document
# pickers (dialog), and reading the picked copy back (fs, scoped to it).
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
# block2: the `UIAlertAction` handler of the native picker is an ObjC block.
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }
objc2-ui-kit = { version = "0.3", features = ["UIActivityViewController", "UIAlertController", "UIApplication", "UIInterface", "UIPopoverPresentationController", "UITraitCollection", "UIViewController", "UIView", "UIWindow", "UIWindowScene"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
dispatch2 = "0.3"

# Keystore credential store, FileProvider sharing, and the cleartext LAN
# network policy. Android-only: it must be a direct dependency so
# tauri-build adds its Kotlin library to the generated Gradle project.
[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-openagentd-android = { path = "../android-plugin" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread"] }
# The fake cloud of native/cloud/tests, for the account end-to-end test.
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", features = ["sink"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

# Thin LTO preserves cross-crate optimization while allowing parallel codegen;
# strip drops debug symbols from the shipped executable (crash traces still
# come from the webview/backend logs).
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
