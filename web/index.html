<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF6EC" media="(prefers-color-scheme: light)" />
    <title>openagentd</title>
    <script src="/theme-init.js"></script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #faf6ec;
      }

      html.dark,
      html.dark body,
      html.dark #root {
        background: #15110d;
      }

      .app-boot-loader {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-boot-loader__logo {
        width: 88px;
        height: 88px;
        display: block;
        color: #1a1714;
        fill: currentColor;
      }

      /* The Seal's dot (the agent) breathes while the app loads; the same
         pulse as .oa-seal-pulse in src/index.css, which is not loaded yet. */
      .app-boot-loader__dot {
        fill: #5aa8e2;
        animation: app-boot-loader-pulse 800ms cubic-bezier(0.4, 0, 0.2, 1) infinite alternate;
      }

      html.dark .app-boot-loader__logo {
        color: #f5ebd8;
      }

      html.dark .app-boot-loader__dot {
        fill: #7cc2f0;
      }

      @keyframes app-boot-loader-pulse {
        from { opacity: 1; }
        to { opacity: 0.35; }
      }

      @media (prefers-reduced-motion: reduce) {
        .app-boot-loader__dot {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-boot-loader" role="status" aria-label="Loading OpenAgentd" aria-live="polite"><!-- brand:seal:start --><svg class="app-boot-loader__logo" viewBox="0 0 64 64" width="88" height="88" aria-hidden="true" focusable="false"><path fill-rule="evenodd" d="M5 32A27 27 0 1 0 59 32A27 27 0 1 0 5 32ZM17.2 47L29.2 18.8A3 3 0 0 1 34.8 18.8L46.8 47L40.2 47L32 27.7L23.8 47Z"/><circle class="app-boot-loader__dot" cx="32" cy="39" r="3.75"/></svg><!-- brand:seal:end --></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
