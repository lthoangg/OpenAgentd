[package]
name = "openagentd-desktop"
version = "3.38.0"
description = "OpenAgentd — on-machine coding agent (desktop shell)"
authors = ["openagentd contributors"]
license = "Apache-2.0"
homepage = "https://openagentd.dev"
repository = "https://github.com/lthoangg/openagentd"
edition = "2021"
rust-version = "1.77.2"

# https://crates.io/crates/tauri-build
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openagentd-shell-core = { path = "../../native/shell-core" }
tauri = { version = "2", features = ["image-png", "tray-icon", "macos-private-api"] }
tauri-plugin-positioner = { version = "2", features = ["tray-icon"] }
# Tauri's image-png feature permits newer image releases whose MSRV exceeds ours.
image = { version = "=0.25.10", default-features = false }
time = "=0.3.55"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
notify-rust = "4.18.0"
# Default features minus `zip`: that feature only unpacks Tauri v1 `.zip` /
# compressed-AppImage update bundles, which we do not publish
# (`createUpdaterArtifacts: true`), and it pulls zip 4.x, which has unpatched
# advisories. macOS `.app.tar.gz` updates do not depend on it.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "process", "rt", "sync", "time"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls-native-roots"], default-features = false }
log = "0.4"
anyhow = "1"
once_cell = "1"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
url = "2"
base64 = "0.23"
getrandom = "0.4"

[dev-dependencies]
# Enables `tauri::test::mock_app()` used by the native unit-test suite.
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal"] }

# The notch island (src/island.rs) sets window level, Spaces behaviour and
# frame through AppKit. Tauri already builds these crates; the versions match
# Cargo.lock and every feature listed is one Tauri already turns on.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSGeometry", "NSArray", "objc2-core-foundation"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSResponder", "NSScreen", "NSWindow", "objc2-core-foundation"] }
# The desktop pet reads where other apps' windows are (CGWindowListCopyWindowInfo:
# frames only, no window titles, so no Screen Recording permission).
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow", "CGGeometry"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString", "CFCGTypes"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    # Required for CreateJobObjectW (it takes a
    # SECURITY_ATTRIBUTES pointer in its signature).
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    # SHQueryUserNotificationState: the desktop pet steps aside for
    # full-screen apps and presentations.
    "Win32_UI_Shell",
    # EnumWindows and DWM frame bounds: the desktop pet climbs onto other
    # apps' windows.
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Dwm",
] }

[features]
# this feature is used for production builds or when a dev server is not specified
custom-protocol = ["tauri/custom-protocol"]

# Thin LTO preserves cross-crate optimization while allowing parallel codegen;
# strip drops debug symbols from the shipped executable (crash traces still
# come from the webview/backend logs).
[profile.release]
lto = "thin"
codegen-units = 16
strip = true
