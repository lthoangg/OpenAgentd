name: Documentation contracts

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "Makefile"
      - "scripts/**"
      - "install.ps1"
      - "desktop/scripts/**"
      - "desktop/src-tauri/tauri.conf.json"
      - "desktop/src-tauri/entitlements.plist"
      - "desktop/src-tauri/Cargo.lock"
      - "mobile/Makefile"
      - "mobile/src-tauri/tauri.conf.json"
      - "web/package.json"
      - "web/bun.lock"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/tauri.yml"
      - ".github/workflows/publish-homebrew-cask.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "**/*.md"
      - "Makefile"
      - "scripts/**"
      - "install.ps1"
      - "desktop/scripts/**"
      - "desktop/src-tauri/tauri.conf.json"
      - "desktop/src-tauri/entitlements.plist"
      - "desktop/src-tauri/Cargo.lock"
      - "mobile/Makefile"
      - "mobile/src-tauri/tauri.conf.json"
      - "web/package.json"
      - "web/bun.lock"
      - ".github/workflows/release-desktop.yml"
      - ".github/workflows/tauri.yml"
      - ".github/workflows/publish-homebrew-cask.yml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate documentation contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv & Python 3.14
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          # No lockfile to key a cache on; the tooling tests' few deps
          # (declared in the Makefile's verify-scripts) install in seconds.
          enable-cache: false

      - name: Run tooling tests
        run: make verify-scripts

      - name: Validate repository documentation
        run: make verify-docs
