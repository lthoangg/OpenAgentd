[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/db",
    "crates/tools",
    "crates/terminal",
    "crates/providers",
    "crates/jsplugin",
    "crates/agent",
    "crates/memory",
    "crates/mcp",
    "crates/api",
    "crates/cli",
    "crates/preview",
]

[workspace.package]
version = "3.8.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/lthoangg/openagentd"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order", "float_roundtrip", "raw_value"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v5", "v4", "v7", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
directories = "6.0"
sha2 = "0.10"
# SQLite only (no TLS); migrations are replayed by hand and no query macros
# are used, so only the `FromRow` derive is needed.
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio", "chrono", "uuid", "derive"] }
ignore = "0.4"
dunce = "1"
gix = { version = "0.87", default-features = false, features = ["status", "attributes", "excludes", "dirwalk", "index", "sha1", "parallel", "max-performance-safe"] }
regex = "1.11"
glob = "0.3"
shlex = "1.3"
portable-pty = "0.8"
async-trait = "0.1"
futures = "0.3"
tokio-stream = "0.1"
async-stream = "0.3"
cron = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "stream"] }
axum = { version = "0.8", features = ["ws", "macros", "multipart"] }
tower = "0.5"
# gzip is the only encoding the API negotiates (`middleware::gzip_layer`).
tower-http = { version = "0.7", features = ["cors", "trace", "compression-gzip", "set-header", "limit", "catch-panic"] }
clap = { version = "4.5", features = ["derive", "env"] }
appv3-core = { path = "crates/core" }
appv3-db = { path = "crates/db" }
appv3-tools = { path = "crates/tools" }
appv3-providers = { path = "crates/providers" }
appv3-jsplugin = { path = "crates/jsplugin" }
appv3-agent = { path = "crates/agent" }
appv3-terminal = { path = "crates/terminal" }
appv3-memory = { path = "crates/memory" }
appv3-mcp = { path = "crates/mcp" }
appv3-api = { path = "crates/api" }
appv3-preview = { path = "crates/preview" }

[profile.release]
lto = "thin"
codegen-units = 16
strip = false

# `make dev` and `cargo test`: line tables keep panic and backtrace locations
# at a fraction of full debug info's link time and size, and dependencies
# (bundled SQLite, gix, regex, oxc, QuickJS) run optimised. Workspace crates
# stay at opt-level 0, so rebuilding them is as fast as before.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Shipped binaries (`cargo build --profile dist`): whole-program optimisation
# for the desktop sidecar, at the cost of a much slower build. `strip` stays
# off (Xcode's strip corrupts some Rust dylibs); unwinding stays on so a
# panicking task fails alone instead of aborting the server.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
