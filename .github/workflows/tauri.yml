name: Tauri

on:
  push:
    branches: [main]
    paths:
      - "desktop/src-tauri/**"
      - "mobile/src-tauri/**"
      - ".github/workflows/tauri.yml"
      - ".github/workflows/release-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "desktop/src-tauri/**"
      - "mobile/src-tauri/**"
      - ".github/workflows/tauri.yml"
      - ".github/workflows/release-desktop.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt JS actions into Node.js 24 ahead of the June 2026 forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  changes:
    name: Detect Tauri changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.filter.outputs.desktop }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            desktop:
              - 'desktop/src-tauri/**'
              - '.github/workflows/tauri.yml'
              - '.github/workflows/release-desktop.yml'
            mobile:
              - 'mobile/src-tauri/**'
              - '.github/workflows/tauri.yml'

  desktop:
    name: Cargo check (desktop)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux WebKitGTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Cargo check
        run: TAURI_CONFIG="$(cat tauri.dev.conf.json)" cargo check --locked

      - name: Cargo test
        run: TAURI_CONFIG="$(cat tauri.dev.conf.json)" cargo test --locked

      # The desktop target is Linux-only here, so Clippy sees only portable
      # code paths supported by this runner.
      - name: Cargo clippy
        run: TAURI_CONFIG="$(cat tauri.dev.conf.json)" cargo clippy --locked --all-targets

  desktop-windows:
    name: Cargo check (desktop / Windows)
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-2025
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
          key: windows-x86_64

      - name: Cargo check
        run: $env:TAURI_CONFIG = Get-Content tauri.dev.conf.json -Raw; cargo check --locked

      - name: Cargo test
        run: $env:TAURI_CONFIG = Get-Content tauri.dev.conf.json -Raw; cargo test --locked

      - name: Cargo clippy
        run: $env:TAURI_CONFIG = Get-Content tauri.dev.conf.json -Raw; cargo clippy --locked --all-targets

  mobile:
    name: Cargo check (mobile)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: mobile/src-tauri
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux WebKitGTK deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: mobile/src-tauri

      - name: Cargo check
        run: TAURI_CONFIG='{"bundle":{"icon":["icons/icon.png"]}}' cargo check --locked
