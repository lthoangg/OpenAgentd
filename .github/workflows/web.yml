name: Web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "appv3/crates/agent/data/sse_events.json"
      - "Makefile"
      - "desktop/src-tauri/tauri*.conf.json"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/Cargo.lock"
      - "mobile/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/release-desktop.yml"
  pull_request:
    branches: [main]
    paths:
      - "web/**"
      - "appv3/crates/agent/data/sse_events.json"
      - "Makefile"
      - "desktop/src-tauri/tauri*.conf.json"
      - "desktop/src-tauri/Cargo.toml"
      - "desktop/src-tauri/Cargo.lock"
      - "mobile/**"
      - ".github/workflows/web.yml"
      - ".github/workflows/release-desktop.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt JS actions into Node.js 24 ahead of the June 2026 forced switch.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  web:
    name: Web (lint, typecheck, test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Cache Bun install cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('web/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Type check (app)
        run: bun run typecheck

      - name: Type check (tests)
        run: bun exec tsc -p tsconfig.test.json --noEmit

      - name: Tests
        run: bun run test

      - name: Production build and bundle budgets
        run: bun run build
