[package]
name = "appv3-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
# Two binaries (`agentd` and the `openagentd` alias), so `cargo run` needs a default.
default-run = "agentd"

[[bin]]
name = "agentd"
path = "src/main.rs"

# The pre-rename name, kept as a forwarding alias so existing installs,
# scripts, and `openagentd upgrade` from older releases keep working.
[[bin]]
name = "openagentd"
path = "src/bin/openagentd.rs"

[dependencies]
dunce.workspace = true
appv3-core.workspace = true
appv3-db.workspace = true
appv3-api.workspace = true
appv3-preview.workspace = true
appv3-tools.workspace = true
axum.workspace = true
anyhow.workspace = true
clap.workspace = true
tokio.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
chrono.workspace = true
appv3-agent.workspace = true
appv3-providers.workspace = true
regex.workspace = true
uuid.workspace = true
sqlx.workspace = true
tar = "0.4"
flate2 = "1"
libc = "0.2"
reqwest.workspace = true
sha2.workspace = true
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_SystemInformation"] }

[dev-dependencies]
tempfile = "3"
