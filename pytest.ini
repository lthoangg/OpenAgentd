[pytest]
env =
    OPENAGENTD_DATA_DIR=.tests/data
    OPENAGENTD_CONFIG_DIR=.tests/config
    OPENAGENTD_STATE_DIR=.tests/state
    OPENAGENTD_CACHE_DIR=.tests/cache
    OPENAGENTD_MODEL_REGISTRY_REFRESH=false
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts =
    -q
    --dist=loadscope
markers =
    asyncio: mark a test as an asyncio-based test.
    slow: mark a test as slow.

filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning

# Individually every test in this suite runs in well under a second (or has
# its own @pytest.mark.timeout override for legitimate long-runners, e.g.
# real subprocess/PTY tests). 3s was tuned against a single-worker run —
# under -n 4 real CPU contention, otherwise-fast tests (tokenizer loading,
# text-budget computation) can tip past that purely from being scheduled on
# an oversubscribed CPU, not from being slow. 30s keeps this a backstop
# against genuinely hung tests without flagging contention noise.
timeout = 30
# 'thread' escalates to os._exit(1) on expiry, which kills the whole
# pytest-xdist WORKER PROCESS mid-test (not just the test) — surfacing as
# "node down: Not properly terminated" and, under load, a cascade of
# replacement workers hitting the same fate. 'signal' (SIGALRM) raises a
# normal test failure in the current test instead, leaving the worker (and
# the rest of the run) alive.
timeout_method = signal
