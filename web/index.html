<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand-assets/openagentd-app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#15110D" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAF6EC" media="(prefers-color-scheme: light)" />
    <title>openagentd</title>
    <script src="/theme-init.js"></script>
    <style>
      html,
      body,
      #root {
        min-height: 100%;
        margin: 0;
        background: #faf6ec;
      }

      html.dark,
      html.dark body,
      html.dark #root {
        background: #15110d;
      }

      .app-boot-loader {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .app-boot-loader__logo {
        width: 88px;
        height: 88px;
        border-radius: 16px;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="root"><div class="app-boot-loader" role="status" aria-label="Loading OpenAgentd" aria-live="polite"><img class="app-boot-loader__logo" src="/brand-assets/openagentd-app-icon.png" alt="" aria-hidden="true" /></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
