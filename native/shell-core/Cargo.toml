[package]
name = "openagentd-shell-core"
version = "0.0.0"
description = "Tauri-free logic shared by the OpenAgentd desktop and mobile shells"
authors = ["openagentd contributors"]
license = "Apache-2.0"
homepage = "https://openagentd.dev"
repository = "https://github.com/lthoangg/openagentd"
edition = "2021"
rust-version = "1.77.2"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Only the mobile shell keeps access keys in the OS credential store; the
# desktop uses a user-only file (see src/access_key.rs).
keyring = { version = "3.6.3", default-features = false, optional = true }
# TLS backend and platform roots are chosen by each shell's own reqwest
# dependency; Cargo unifies features across the graph, so this crate only
# asks for what it calls.
reqwest = { version = "0.12", features = ["json"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# The preview relay's listener and tunnels; spawned on the shell's runtime.
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
# WebSocket framing only: the handshake and TLS go through the shell's
# reqwest client (see src/preview_relay.rs).
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
url = "2"

[features]
keyring = ["dep:keyring"]

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
