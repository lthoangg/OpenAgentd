[package]
name = "openagentd-mobile"
version = "1.115.2"
description = "OpenAgentd mobile shell"
authors = ["openagentd contributors"]
license = "Apache-2.0"
repository = "https://github.com/lthoangg/openagentd"
edition = "2021"
rust-version = "1.77"

[lib]
name = "openagentd_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
time = "=0.3.54"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-haptics = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
url = "2"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
base64 = "0.22"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSArray"] }
objc2-ui-kit = { version = "0.3", features = ["UIActivityViewController", "UIApplication", "UIPopoverPresentationController", "UIViewController", "UIView", "UIWindow", "UIWindowScene"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
dispatch2 = "0.3"

[dev-dependencies]
tempfile = "3"

[features]
custom-protocol = ["tauri/custom-protocol"]

# Smaller, faster-loading release binary. Whole-crate LTO + single codegen
# unit enable cross-crate inlining; strip drops debug symbols from the
# shipped executable (crash traces still come from the webview/backend logs).
[profile.release]
lto = true
codegen-units = 1
strip = true
