# `pre-commit install` sets up both hook types. Hooks run at commit unless
# they name another stage; the hygiene hooks name theirs because their own
# manifest would add them to the push as well.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  # ---------------------------------------------------------------------------
  # General file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^.*\.(py|ts|tsx|md|yaml|yml|toml|ini)$
        stages: [pre-commit]
      - id: end-of-file-fixer
        files: ^.*\.(py|ts|tsx|md|yaml|yml|toml|ini)$
        stages: [pre-commit]
      - id: check-yaml
        stages: [pre-commit]
      - id: check-toml
        stages: [pre-commit]
      - id: check-merge-conflict
        stages: [pre-commit]
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^documents/assets/
        stages: [pre-commit]

  # ---------------------------------------------------------------------------
  # Frontend – lint (Oxlint) & type check (unified tsc -b)
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint (web)
        language: system
        entry: bash -c 'cd web && bun run lint'
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false
      - id: tsc
        name: tsc (web)
        language: system
        entry: bash -c 'cd web && bun run typecheck'
        files: ^web/src/.*\.(ts|tsx)$
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Commit – checks of the whole tree cheap enough for every commit. They read
  # the index, so a file staged for the first time is checked too. Pushes are
  # rare here, so a check left to the push hook lets main stay broken for days.
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: file-size
        name: file size ceilings
        language: system
        entry: python3 scripts/check_file_size.py
        files: \.(ts|tsx|rs)$
        pass_filenames: false
      - id: portable-tests
        name: tests that also run on Windows
        language: system
        entry: python3 scripts/check_portable_tests.py
        files: ^appv3/.*\.rs$|^\.gitattributes$
        pass_filenames: false
      - id: no-secrets
        name: secret scan
        language: system
        entry: python3 scripts/check_no_secrets.py
        always_run: true
        pass_filenames: false

  # ---------------------------------------------------------------------------
  # Push – the static checks CI would otherwise be the first to run
  # ---------------------------------------------------------------------------
  - repo: local
    hooks:
      - id: verify-quick
        name: make verify-quick
        language: system
        entry: make verify-quick
        always_run: true
        pass_filenames: false
        stages: [pre-push]
