name: secrets

# This repository is public. Every change is scanned for secret-shaped
# values: gitleaks with its default rules (.gitleaks.toml), and the repo's
# own check for OpenAgentd Cloud tokens, infrastructure ids and personal
# email addresses (scripts/check_no_secrets.py), over the tree and the
# history.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Python 3.14
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Repository check (tree)
        run: python3 scripts/check_no_secrets.py

      - name: Repository check (history and commit messages)
        run: python3 scripts/check_no_secrets.py --history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
